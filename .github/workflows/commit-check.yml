name: Commit check

# Shared enforcement of ENG-STD-005 §1 on the git host (ENG-DEC-009).
# A project calls it from its own workflow, pinned to a full commit SHA:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, edited]
#   jobs:
#     commit-check:
#       uses: praveenprk/eng-principles/.github/workflows/commit-check.yml@<sha>
#       with:
#         config: scripts/hooks      # the project's types and anchors
#
# It runs hooks/check-pr from the same eng-principles commit as this file,
# against the project's own config and registers, read from the pull
# request's head commit. A pull request opened before the project adopted
# this check fails until its branch is updated with main (README: Adopting).
# On a pull request into another branch, such as a main → stable promotion,
# commits already on the default branch are not checked again; they were
# checked when they landed there (hooks/check-pr: Promotions). Job `questions` runs
# hooks/check-questions on pull requests into the default branch
# (ENG-DEC-010); a project without docs/QUESTIONS.md passes it.
on:
  workflow_call:
    inputs:
      config:
        description: Directory, relative to the project root, holding the project's `types` and `anchors`
        type: string
        default: scripts/hooks
      questions:
        description: The project's questions register, relative to the project root (ENG-DEC-010)
        type: string
        default: docs/QUESTIONS.md

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: praveenprk/eng-principles
          ref: ${{ github.job_workflow_sha }}
          path: .eng-principles
      - name: Issues and pull requests of this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" --jq '.[].number' > "$RUNNER_TEMP/issues"
      - name: Commits of this pull request that GitHub signed (ENG-DEC-021)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100"
          --jq '.[] | select(.commit.verification.verified and .commit.committer.email == "noreply@github.com") | .sha'
          > "$RUNNER_TEMP/github-signed"
      - name: Title, description and every commit follow ENG-STD-005 §1
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          CONFIG: ${{ inputs.config }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          landed=
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            landed=$(git rev-parse --verify "refs/remotes/origin/$DEFAULT_BRANCH^{commit}")
          fi
          ENG_LANDED="$landed" ENG_HOOKS_CONFIG="$PWD/$CONFIG" ENG_ISSUES_FILE="$RUNNER_TEMP/issues" ENG_SIGNED_FILE="$RUNNER_TEMP/github-signed" sh .eng-principles/hooks/check-pr

  questions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: praveenprk/eng-principles
          ref: ${{ github.job_workflow_sha }}
          path: .eng-principles
      - name: No open question reaches the default branch (ENG-DEC-010)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          QUESTIONS: ${{ inputs.questions }}
        run: |
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "base is $BASE_REF, not $DEFAULT_BRANCH: questions may stay open"
            exit 0
          fi
          sh .eng-principles/hooks/check-questions "$QUESTIONS"
