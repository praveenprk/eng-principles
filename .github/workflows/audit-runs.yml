name: Audit run record

# A dated, committed record of audit runs: the L4 evidence ENG-STD-009 §3.1
# asks for (issue #22 item 8, option a). Each run opens a pull request that
# adds audit/runs/YYYY-MM-DD.json; nothing reaches main without a PR. The
# record is the redacted report: no evidence from private repositories
# (render.py --public).
#
# The push and the pull request use a token minted from a GitHub App
# (secrets AUDIT_RUNS_APP_ID, AUDIT_RUNS_APP_KEY), installed on eng-principles
# only, with Contents and Pull requests read and write. Unlike GITHUB_TOKEN,
# its pull requests trigger CI, so they can pass required checks (issue #22).
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-runs
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDIT_RUNS_APP_ID }}
          private-key: ${{ secrets.AUDIT_RUNS_APP_KEY }}
          repositories: eng-principles
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit every governed project and keep the redacted report
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN || github.token }}
        run: |
          day=$(date -u +%Y-%m-%d)
          echo "DAY=$day" >> "$GITHUB_ENV"
          mkdir -p audit/runs
          python3 audit/audit.py audit/projects.json > "$RUNNER_TEMP/report.json"
          python3 audit/render.py --public "$RUNNER_TEMP/report.json" > "audit/runs/$day.json"
      - name: Open a pull request with the record
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          branch="chore/ENG-STD-009-audit-run-$DAY"
          # One record per day: a second run that day leaves the first in place.
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "A record for $DAY is already open on $branch; nothing to do."
            exit 0
          fi
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "audit/runs/$DAY.json"
          git commit -m "chore(audit): record the audit run of $DAY — ENG-STD-009"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(audit): record the audit run of $DAY — ENG-STD-009" \
            --body "Dated record of the audit run of $DAY (ENG-STD-009 §3.1, the L4 evidence for the eng-principles audit). Redacted: no evidence from private repositories. Opened by the Audit run record workflow; the governor merges."
