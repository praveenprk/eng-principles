name: Dashboard

# Audits every governed project against ENG-STD-008 and publishes the
# result on GitHub Pages (ENG-DEC-011). Runs daily, on every merge to main,
# and by hand. Reads private repositories only if the AUDIT_TOKEN secret
# (a read-only token) is set; otherwise they show as "not assessed".
on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit every governed project (ENG-STD-008)
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN || github.token }}
        run: |
          mkdir -p site
          # The raw report stays on the runner; only the redacted one is published.
          python3 audit/audit.py audit/projects.json > "$RUNNER_TEMP/report.json"
          python3 audit/render.py --public "$RUNNER_TEMP/report.json" > site/report.json
          python3 audit/render.py site/report.json > site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
