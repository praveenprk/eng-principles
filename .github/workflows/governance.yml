name: Governance

# eng-principles holds itself to the check it gives every project
# (ENG-DEC-009), and runs the hook tests.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  hooks-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh hooks/test
  audit-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 audit/selftest.py
  commit-check:
    uses: ./.github/workflows/commit-check.yml
    with:
      config: hooks
